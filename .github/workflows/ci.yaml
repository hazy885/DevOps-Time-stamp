name: Complete DevOps Projects Pipeline 

on:
  push:
    branches:
      - main
  
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
        
      - name: Build Docker Image
        run: |
          docker build -t thedevopsdude/complete-devops-project:${{ env.SHORT_SHA }} .
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKET_USERNAME }}
          password: ${{ secrets.DOCKET_TOKEN }}
      - name: Push to Docker Hub
        run: |
          docker push thedevopsdude/complete-devops-project:${{ env.SHORT_SHA }}